<div class="modal-header">
  <h5 class="modal-title">Nueva actividad</h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <form [formGroup]="actividadForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Concepto <span class="text-danger">*</span></label>
        <input type="text" class="form-control" formControlName="concepto" required >
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Categoria <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="categoria">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let c of categoriaMantenimientos" [value]="c">{{c}}</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Periodicidad <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="periodicidad">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let p of periodicidades" [value]="p">{{p}}</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Estado <span class="text-danger">*</span></label>
        <select class="form-select" formControlName="estado">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let e of estados" [value]="e">{{e}}</option>
        </select>
      </div>
      <div class="col-6 mb-3">
        <label class="form-label">Fecha registro <span class="text-danger">*</span></label>
        <input class="form-control" formControlName="fecha_registro" rows="2" required>
      </div>
      <div class="col-6 mb-3">
        <label class="form-label">Costo <span class="text-danger">*</span></label>
        <input class="form-control" formControlName="costo" rows="2" required>
      </div>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-primary" [disabled]="actividadForm.invalid" (click)="guardar()">
    Guardar actividad
  </button>
</div>
<ng-template #modalExito let-modal>
  <div class="modal-header bg-success text-white">
    <h4 class="modal-title">¡Operación Exitosa!</h4>
    <button type="button" class="btn-close btn-close-white" (click)="modal.close()"></button>
  </div>
  <div class="modal-body text-center py-4">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
    <p class="mt-3 fs-5">
      El actividad <strong>"{{ nombreActividadReciente }}"</strong> ha sido registrado
    </p>
  </div>
  <div class="modal-footer d-flex justify-content-center">
    <button type="button" class="btn btn-success px-4" (click)="modal.close()">Entendido</button>
  </div>
</ng-template>
