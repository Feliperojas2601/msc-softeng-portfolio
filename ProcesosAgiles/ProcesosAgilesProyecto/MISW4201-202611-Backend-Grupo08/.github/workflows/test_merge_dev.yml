name: integracion HU a develop con pruebas unitarias exitosas

# Controls when the action will run. 
on:
  push:
    branches: 
    - '[Ff][Tt]**'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  job1:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
    - name: Checkout de repositorio
      uses: actions/checkout@v2
    - name: Configuración de entorno de python
      uses: actions/setup-python@v2
    - name: Instalación de librerías y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: validar_palabra
      id: validar_palabra
      if: ${{ contains(github.event.head_commit.message, 'completo') }} 
      run: echo "palabra clave encontrada"
    - name: Mezcla develop -> ${{ github.ref }}
      if: steps.validar_palabra.outcome == 'success'
      uses: tukasz/direct-merge-action@master
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        source-branch: develop
        target-branch: ${{ github.ref }} 
    - name: Correr pruebas
      if: steps.validar_palabra.outcome == 'success'
      id: correr_pruebas
      run: python -m pytest tests
    - name: Validar resultado con errores
      id: validar_resultado_con_errores
      if: ${{ failure() }}
      env:
        MENSAJE_ERROR: Una o varias pruebas fallaron
      run: |
        echo "::set-output name=respuesta::${MENSAJE_ERROR}"
        exit 1
    - name: Validar resultado sin errores
      id: validar_resultado_sin_errores
      if: ${{ success() }}
      env:
        MENSAJE_EXITO: Todas las pruebas fueron exitosas
      run: echo "::set-output name=respuesta::${MENSAJE_EXITO}"
    - name: Mezcla ${{ github.ref }} -> develop
      id: mezcla_hu_develop
      if: steps.correr_pruebas.outcome == 'success' 
      uses: tukasz/direct-merge-action@master
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        source-branch: ${{ github.ref }} 
        target-branch: develop