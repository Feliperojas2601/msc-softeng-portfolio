services:
  routes_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: routes_db
      POSTGRES_USER: routes_app
      POSTGRES_PASSWORD: routes_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routes_app -d routes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  routes_app:
    build:
      context: .
      target: runner
    ports:
      - "30002:30002"
    environment:
      DB_HOST: routes_db
      DB_PORT: 5432
      DB_NAME: routes_db
      DB_USER: routes_app
      DB_PASSWORD: routes_app
      APP_PORT: 30002
    depends_on:
      routes_db:
        condition: service_healthy
