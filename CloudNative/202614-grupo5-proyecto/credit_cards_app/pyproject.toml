[project]
name = "credit-cards-app"
version = "0.1.0"
description = "Synchronous credit cards API service."
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "sqlalchemy (>=2.0.28,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<9.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
ruff = ">=0.11.13,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
lint.ignore = ["B008"]
