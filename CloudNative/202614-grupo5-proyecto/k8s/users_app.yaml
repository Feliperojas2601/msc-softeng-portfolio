apiVersion: v1
kind: Secret
metadata:
  name: users-db-secret
  namespace: default
type: Opaque
data:
  POSTGRES_DB: dXNlcnNfZGI=
  POSTGRES_USER: dXNlcnNfYXBw
  POSTGRES_PASSWORD: dXNlcnNfYXBw

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db-deployment
  namespace: default
  labels:
    app: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: users-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: users-db-secret
          volumeMounts:
            - name: users-db-volumen
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "users_app", "-d", "users_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "users_app", "-d", "users_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: users-db-volumen
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: users-db-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: users-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app-deployment
  namespace: default
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      initContainers:
        - name: wait-for-users-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z users-db-service 5432; do echo waiting for users-db-service; sleep 2; done
      containers:
        - name: users-app
          image: users_app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30000
          env:
            - name: APP_PORT
              value: "30000"
            - name: DB_HOST
              value: users-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /users/ping
              port: 30000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /users/ping
              port: 30000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: users-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: users-app
  ports:
    - port: 80
      targetPort: 30000
      nodePort: 30000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-network
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: users-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-app
      ports:
        - protocol: TCP
          port: 5432
