apiVersion: v1
kind: Secret
metadata:
  name: routes-db-secret
  namespace: default
type: Opaque
stringData:
  DB_HOST: "${DB_HOST}"
  DB_PORT: "${DB_PORT}"
  DB_NAME: "${DB_NAME}"
  DB_USER: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  namespace: default
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z "${DB_HOST}" "${DB_PORT}"; do echo esperando la base de datos; sleep 2; done
      containers:
        - name: routes-app
          image: ${ECR_REGISTRY}/routes_app:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 30002
          envFrom:
            - secretRef:
                name: routes-db-secret
          env:
            - name: APP_PORT
              value: "30002"
          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 30002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 30002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - port: 80
      targetPort: 30002
      nodePort: 30002
