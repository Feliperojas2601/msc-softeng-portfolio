apiVersion: v1
kind: Secret
metadata:
  name: offers-db-secret
  namespace: default
type: Opaque
data:
  POSTGRES_DB: b2ZmZXJzX2Ri
  POSTGRES_USER: b2ZmZXJzX2FwcA==
  POSTGRES_PASSWORD: b2ZmZXJzX2FwcA==

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-db-deployment
  namespace: default
  labels:
    app: offers-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offers-db
  template:
    metadata:
      labels:
        app: offers-db
    spec:
      containers:
        - name: offers-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: offers-db-secret
          volumeMounts:
            - name: offers-db-volumen
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "offers_app", "-d", "offers_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "offers_app", "-d", "offers_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: offers-db-volumen
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: offers-db-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: offers-db
  ports:
    - port: 5432
      targetPort: 5432

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-app-deployment
  namespace: default
  labels:
    app: offers-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offers-app
  template:
    metadata:
      labels:
        app: offers-app
    spec:
      initContainers:
        - name: wait-for-offers-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z offers-db-service 5432; do echo waiting for offers-db-service; sleep 2; done
      containers:
        - name: offers-app
          image: offers_app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30003
          env:
            - name: APP_PORT
              value: "30003"
            - name: DB_HOST
              value: offers-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: offers-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: offers-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: offers-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /offers/ping
              port: 30003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /offers/ping
              port: 30003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---

apiVersion: v1
kind: Service
metadata:
  name: offers-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: offers-app
  ports:
    - port: 80
      targetPort: 30003
      nodePort: 30003

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: offers-network
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: offers-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: offers-app
      ports:
        - protocol: TCP
          port: 5432
