apiVersion: v1
kind: Secret
metadata:
  name: routes-db-secret
  namespace: default
type: Opaque
data:
  POSTGRES_DB: cm91dGVzX2Ri
  POSTGRES_USER: cm91dGVzX2FwcA==
  POSTGRES_PASSWORD: cm91dGVzX2FwcA==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-db-deployment
  namespace: default
  labels:
    app: routes-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-db
  template:
    metadata:
      labels:
        app: routes-db
    spec:
      containers:
        - name: routes-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: routes-db-secret
          volumeMounts:
            - name: routes-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "routes_app", "-d", "routes_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "routes_app", "-d", "routes_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: routes-db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: routes-db-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: routes-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routes-app-deployment
  namespace: default
  labels:
    app: routes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routes-app
  template:
    metadata:
      labels:
        app: routes-app
    spec:
      initContainers:
        - name: wait-for-routes-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z routes-db-service 5432; do echo waiting for routes-db-service; sleep 2; done
      containers:
        - name: routes-app
          image: routes_app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30002
          env:
            - name: APP_PORT
              value: "30002"
            - name: DB_HOST
              value: routes-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: routes-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: routes-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: routes-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /routes/ping
              port: 30002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /routes/ping
              port: 30002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: routes-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: routes-app
  ports:
    - port: 80
      targetPort: 30002
      nodePort: 30002

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routes-network
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: routes-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: routes-app
      ports:
        - protocol: TCP
          port: 5432
