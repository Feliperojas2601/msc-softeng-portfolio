[project]
name = "posts-app"
version = "0.1.0"
description = "Posts API service."
authors = [
    {name = "Gabs-489", email = "gabrielazambranoz@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "sqlalchemy[asyncio] (~=2.0.28)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "greenlet (>=3.1.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.0,<9.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-asyncio = ">=0.23.5,<1.0.0"
pytest-env = ">=1.1.5,<2.0.0"
pytest-mock = ">=3.14.1,<4.0.0"
httpx = ">=0.27.0,<1.0.0"
faker = ">=37.3.0,<38.0.0"
black = ">=26.5.1,<27.0.0"
isort = ">=8.0.1,<9.0.0"
bandit = ">=1.8.3,<2.0.0"
ruff = ">=0.11.13,<1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["./tests"]
skips = ["B101"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.ruff]
src = ["src"]
fix = true
lint.ignore = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
python_files = "test_*.py"
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests"
]
asyncio_mode = "auto"
env = [
  "LOG_LEVEL = INFO",
  "DB_HOST = localhost",
  "DB_PORT = 5432",
  "DB_NAME = posts_db_test",
  "DB_USER = test",
  "DB_PASSWORD = test"
]