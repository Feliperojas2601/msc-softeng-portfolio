services:
  posts_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posts_db
      POSTGRES_USER: posts_app
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posts_app -d posts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  posts_app:
    build:
      context: .
      target: runner
    ports:
      - "30001:30001"
    environment:
      DB_HOST: posts_db
      DB_PORT: 5432
      DB_NAME: posts_db
      DB_USER: posts_app
      DB_PASSWORD: postgres
      APP_PORT: 30001
    depends_on:
      posts_db:
        condition: service_healthy