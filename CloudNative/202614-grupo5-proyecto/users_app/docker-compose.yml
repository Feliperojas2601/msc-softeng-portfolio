services:
  users_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_app
      POSTGRES_PASSWORD: users_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_app -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  users_app:
    build:
      context: .
      target: runner
    ports:
      - "30000:30000"
    environment:
      DB_HOST: users_db
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: users_app
      DB_PASSWORD: users_app
      APP_PORT: 30000
    depends_on:
      users_db:
        condition: service_healthy
